services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "${OR_DB_PORT:-5433}:5432"
    volumes:
      - ris_postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ris"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres123@db:5432/ris
    ports:
      - "${OR_BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${OR_FRONTEND_PORT:-9000}:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "${OR_PGADMIN_PORT:-5050}:80"
    volumes:
      - ris_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  ris_postgres_data:
  ris_pgadmin_data:
